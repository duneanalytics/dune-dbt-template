name: dbt prod incremental

on:
  # schedule:
  #   - cron: '0 6 * * *'  # Daily at 06:00 UTC. Safe default for date-granularity datashare models.
  #   # - cron: '0 * * * *'  # Hourly. Only safe if your datashare models use a timestamp
  #                          # `time_column` with an hour-sized incremental window. See
  #                          # docs/dune-datashares.md "Cadence and sync windows" — a date
  #                          # `time_column` with hourly cadence re-reads the full day on
  #                          # every MERGE (24x cross-region read cost on S3 Export).
  # NOTE: Schedule is disabled by default. Uncomment one cron above when ready.
  # Check the README.md to make sure you understand the credit costs associated with running dbt.
  workflow_dispatch:  # Allow manual triggers

concurrency:
  group: dbt-prod-runs  # Shared group with dbt_deploy.yml to prevent concurrent production runs
  cancel-in-progress: false  # Don't cancel in-progress runs, queue instead

jobs:
  dbt-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    env:
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      DUNE_TEAM_NAME: ${{ vars.DUNE_TEAM_NAME || 'dune' }}  # Set as GitHub Variable or defaults to 'dune'
      DBT_TARGET: prod  # All dbt commands will use the prod target from profiles.yml

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Run models
        run: uv run dbt run --exclude config.materialized:view # views should only run when modified

      - name: Test models
        run: uv run dbt test --exclude config.materialized:view # views should only be tested when modified
