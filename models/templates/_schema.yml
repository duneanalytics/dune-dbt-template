version: 2

models:
  - name: dbt_template_view_model
    description: "A starter dbt view model"
    columns:
      - name: block_number
        description: "The unique block number in last 1 day"
      - name: block_date
        description: "The date of the block"
      - name: total_tx_per_block
        description: "The total number of transactions per block"
  - name: dbt_template_table_model
    description: "A starter dbt table model"
    columns:
      - name: block_number
        description: "The unique block number in last 1 day"
      - name: block_date
        description: "The date of the block"
      - name: total_tx_per_block
        description: "The total number of transactions per block"
  - name: dbt_template_merge_incremental_model
    description: "A starter dbt incremental model using merge strategy"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - block_number
              - block_date
    columns:
      - name: block_number
        description: "The unique block number in last 1 day"
      - name: block_date
        description: "The date of the block"
      - name: total_tx_per_block
        description: "The total number of transactions per block"
  - name: dbt_template_delete_insert_incremental_model
    description: "A starter dbt incremental model using delete+insert strategy"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - block_number
              - block_date
    columns:
      - name: block_number
        description: "The unique block number in last 1 day"
      - name: block_date
        description: "The date of the block"
      - name: total_tx_per_block
        description: "The total number of transactions per block"
  - name: dbt_template_append_incremental_model
    description: "A starter dbt incremental model using append strategy with deduplication logic"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - block_number
              - block_date
    columns:
      - name: block_number
        description: "The unique block number in last 1 day"
      - name: block_date
        description: "The date of the block"
      - name: total_tx_per_block
        description: "The total number of transactions per block"
  - name: dbt_template_datashare_incremental_model
    description: "A starter dbt incremental model using merge strategy with datashare sync enabled"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - block_number
              - block_date
    columns:
      - name: block_number
        description: "The unique block number in the sync window"
      - name: block_date
        description: "The date used for datashare sync windows"
      - name: total_tx_per_block
        description: "The total number of transactions per block"
  - name: dbt_template_datashare_settled_append_model
    description: "A starter insert-only dbt incremental model that syncs settled days of tokens.transfers through DataShare, for Databricks delivery"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - block_date
              - unique_key
    columns:
      - name: blockchain
        description: "The chain the transfer happened on"
      - name: block_date
        description: "The date of the block, used to partition the share"
      - name: unique_key
        description: "Spellbook's per-chain transfer identifier, unique within a block_date"
      - name: amount_raw
        description: "The transferred amount before applying token decimals"
